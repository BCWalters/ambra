name: Private Chrome Web Store release

on:
  workflow_dispatch:
    inputs:
      upload_draft:
        description: Upload validated package to the existing PRIVATE item's draft
        type: boolean
        default: false
        required: true
      publish_trusted_testers:
        description: Also submit to trusted testers (requires upload_draft; disabled from 2026-10-15)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store-private-release
  cancel-in-progress: false

jobs:
  guard:
    name: Check release source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Restrict credentialed uploads to main
        env:
          UPLOAD_DRAFT: ${{ inputs.upload_draft }}
          PUBLISH_TRUSTED_TESTERS: ${{ inputs.publish_trusted_testers }}
        run: |
          if [ "$UPLOAD_DRAFT" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Draft uploads must use main after the release PR is merged."
            exit 1
          fi
          if [ "$PUBLISH_TRUSTED_TESTERS" = "true" ] && [ "$UPLOAD_DRAFT" != "true" ]; then
            echo "::error::Trusted-tester submission requires uploading the validated package in this run."
            exit 1
          fi
          if [ "$PUBLISH_TRUSTED_TESTERS" = "true" ] && [ "$(date -u +%Y-%m-%d)" \> "2026-10-14" ]; then
            echo "::error::The v1 trusted-testers API has sunset. Use the PRIVATE dashboard flow."
            exit 1
          fi
  validate:
    name: Validate release
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  upload:
    name: Upload private candidate
    if: inputs.upload_draft && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Require owner approval and main-only deployments before supplying credentials.
    # Allow self-review for a sole maintainer; disable it once a second reviewer exists.
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-release-${{ github.sha }}
          path: dist/private-release/artifacts/
      - name: Authenticate and upload verified draft
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PRIVATE_VISIBILITY_CONFIRMED: ${{ vars.CWS_PRIVATE_VISIBILITY_CONFIRMED }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node .github/scripts/upload-private-draft.mjs
      - name: Submit explicitly to trusted testers (v1, no public fallback)
        if: inputs.publish_trusted_testers
        env:
          CWS_PUBLISH_TRUSTED_TESTERS: "true"
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PRIVATE_VISIBILITY_CONFIRMED: ${{ vars.CWS_PRIVATE_VISIBILITY_CONFIRMED }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node .github/scripts/publish-trusted-testers.mjs

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Lint, types, units and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      run_browser: ${{ steps.browser-suites.outputs.run_browser }}
      matrix: ${{ steps.browser-groups.outputs.matrix }}
      package_commit: ${{ steps.package-identity.outputs.commit }}
      package_sha256: ${{ steps.package-identity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Select browser suites
        id: browser-suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "workflow_call" ||
                -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            node .github/scripts/select-browser-suites.mjs --full
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- |
              node .github/scripts/select-browser-suites.mjs
          fi
      - name: Select independently rerunnable browser groups
        id: browser-groups
        env:
          BROWSER_MODE: ${{ steps.browser-suites.outputs.mode }}
        run: node .github/scripts/browser-test-groups.mjs --plan "$BROWSER_MODE"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types, and unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          node --test .github/scripts/*.test.mjs
      - name: Build isolated store package
        if: steps.browser-suites.outputs.run_browser == 'true'
        run: node .github/scripts/package-extension.mjs
      - name: Record package identity
        id: package-identity
        if: steps.browser-suites.outputs.run_browser == 'true'
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("dist/beta-release/artifacts/release.json", "utf8"));
            if (release.dirty) throw new Error("CI package must come from a clean checkout.");
            appendFileSync(process.env.GITHUB_OUTPUT, `commit=${release.commit}\nsha256=${release.sha256}\n`);
          '
      - name: Keep package candidate for exact-byte browser validation
        if: steps.browser-suites.outputs.run_browser == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-release-${{ github.sha }}
          path: dist/beta-release/artifacts/
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser regressions (${{ matrix.id }})
    needs: prepare
    if: needs.prepare.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      AMBRA_E2E_EXTENSION_PATH: ${{ github.workspace }}/dist/beta-release/extension
      AMBRA_E2E_HEADLESS: "1"
      AMBRA_E2E_MEDIA_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta-release-${{ github.sha }}
          path: dist/beta-release/artifacts/
      - name: Verify and restore the exact prepared package
        env:
          CI_PACKAGE_COMMIT: ${{ needs.prepare.outputs.package_commit }}
          CI_PACKAGE_SHA256: ${{ needs.prepare.outputs.package_sha256 }}
        run: node .github/scripts/restore-ci-package.mjs
      - name: Bound Ubuntu package downloads
        run: sudo -n install -m 644 .github/apt-network.conf /etc/apt/apt.conf.d/80-ambra-network
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @ambra/e2e exec playwright install --with-deps chromium
      - name: Prepare synthetic EPUB codec fixtures
        if: matrix.codecs
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg || ! command -v cjxl ||
             ! /usr/bin/python3 -c 'import fontTools, brotli'; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg libjxl-tools python3-fonttools python3-brotli
          fi
      - name: Build separate local-feature review package
        if: matrix.localFeatures
        env:
          VITE_AMBRA_LOCAL_FEATURES: "1"
        run: |
          pnpm --filter @ambra/extension build --outDir "${{ runner.temp }}/ambra-local-features"
          echo "AMBRA_E2E_EXTENSION_PATH=${{ runner.temp }}/ambra-local-features" >> "$GITHUB_ENV"
      - name: Run selected browser group without retries
        env:
          BROWSER_GROUP: ${{ matrix.id }}
          VITE_AMBRA_LOCAL_FEATURES: ${{ matrix.localFeatures && '1' || '0' }}
        run: node .github/scripts/browser-test-groups.mjs --run "$BROWSER_GROUP"
      - name: Keep browser timings and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: |
            apps/e2e/ci-browser-results/
            apps/e2e/test-results/**/bookmark-cards-*.png
            apps/e2e/test-results/**/welcome-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: Validate and package
    needs: [prepare, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Require all selected validation groups
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUN_BROWSER: ${{ needs.prepare.outputs.run_browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: node .github/scripts/verify-ci-outcome.mjs

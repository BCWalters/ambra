name: Unlisted Chrome Web Store beta release

on:
  workflow_dispatch:
    inputs:
      upload_draft:
        description: Upload validated package to the existing UNLISTED item's draft
        type: boolean
        default: false
        required: true
      publish_unlisted:
        description: Also publish using owner-confirmed saved UNLISTED visibility (requires upload_draft)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store-beta-release
  cancel-in-progress: false

jobs:
  guard:
    name: Check release source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Restrict credentialed uploads to main
        env:
          UPLOAD_DRAFT: ${{ inputs.upload_draft }}
          PUBLISH_UNLISTED: ${{ inputs.publish_unlisted }}
        run: |
          if [ "$UPLOAD_DRAFT" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Draft uploads must use main after the release PR is merged."
            exit 1
          fi
          if [ "$PUBLISH_UNLISTED" = "true" ] && [ "$UPLOAD_DRAFT" != "true" ]; then
            echo "::error::UNLISTED publication requires uploading the validated package in this run."
            exit 1
          fi
  validate:
    name: Validate release
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  upload:
    name: Upload unlisted beta candidate
    if: inputs.upload_draft && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Require owner approval and main-only deployments before supplying credentials.
    # Allow self-review for a sole maintainer; disable it once a second reviewer exists.
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta-release-${{ github.sha }}
          path: dist/beta-release/artifacts/
      - name: Authenticate and upload verified draft
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_UNLISTED_VISIBILITY_CONFIRMED: ${{ vars.CWS_UNLISTED_VISIBILITY_CONFIRMED }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node .github/scripts/upload-draft.mjs
      - name: Publish using owner-confirmed saved UNLISTED visibility
        if: inputs.publish_unlisted
        env:
          CWS_PUBLISH_UNLISTED: "true"
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_UNLISTED_VISIBILITY_CONFIRMED: ${{ vars.CWS_UNLISTED_VISIBILITY_CONFIRMED }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node .github/scripts/publish-unlisted.mjs
